<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo HUD Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #121212;
            color: #ffffff;
        }
        .dashboard {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
        }
        .metric {
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #4caf50;
        }
        .metric-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #1976D2;
        }
        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid #FF9800;
            background: #2a2a2a;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>Run HUD Setup</h2>
    <div class="btn-group">
        <button id="btn-engo" onclick="connectEngoStep()">1. Connect Engo Glasses</button>
        <button id="btn-stryd" onclick="connectStrydStep()" disabled>2. Connect Stryd Pod</button>
    </div>

    <div id="status">Waiting to start...</div>

    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- W</div>
            <div class="metric-label">Power</div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
    </div>

<script>
// Global tracking variables
let engoDevice = null;
let strydDevice = null;
let engoTxCharacteristic = null;   // Hardware write path (...5cb8)
let engoFlowCharacteristic = null; // Flow Control path (...5cb9)
let strydServiceChar = null;

// Hardware flow configuration tracking
let flowControlReady = true; 
let isEngoCanvasCleared = false;

// ActiveLook / Engo 3 Service Constants
const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_TX_CHAR_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb8';
const ENGO_FLOW_CHAR_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb9';

// Stryd / Standard GATT BLE Sport Profiles
const RSC_SERVICE_UUID = 'running_speed_and_cadence';
const RSC_CHAR_UUID = 'rsc_measurement';
const STRYD_LEGACY_SERVICE = '00001814-0000-1000-8000-00805f9b34fb';

const delay = ms => new Promise(res => setTimeout(res, ms));

function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) {
        statusElement.innerText = msg;
    }
    console.log("[Bridge Log]: " + msg);
}

/**
 * Handle streaming flow control events directly from Engo smart hardware
 */
function handleFlowControl(event) {
    let flowValue = event.target.value.getUint8(0);
    // 0x01/0x02 = Free space available; 0x00 = Hardware display stack is bottlenecked
    flowControlReady = (flowValue !== 0x00);
}

/**
 * Robust GATT Connection Engine
 */
async function robustConnect(device, primaryServiceUUID, charUUID, deviceName, fallbackServiceUUID = null) {
    let retries = 5;
    for (let i = 0; i < retries; i++) {
        try {
            updateStatus(`Connecting to ${deviceName} (Attempt ${i + 1}/${retries})...`);
            if (device.gatt.connected) {
                device.gatt.disconnect();
                await delay(500);
            }
            const server = await device.gatt.connect();
            await delay(1000);

            if (!device.gatt.connected) {
                throw new Error("GATT dropped link initialization.");
            }

            let service;
            try {
                service = await server.getPrimaryService(primaryServiceUUID);
            } catch (e) {
                if (fallbackServiceUUID) {
                    service = await server.getPrimaryService(fallbackServiceUUID);
                } else {
                    throw e;
                }
            }

            // Handle dual-hooking logic if configuring the Engo hardware matrix
            if (primaryServiceUUID === ENGO_SERVICE_UUID) {
                engoFlowCharacteristic = await service.getCharacteristic(ENGO_FLOW_CHAR_UUID);
                await engoFlowCharacteristic.startNotifications();
                engoFlowCharacteristic.addEventListener('characteristicvaluechanged', handleFlowControl);
            }

            const characteristic = await service.getCharacteristic(charUUID);
            return characteristic;
        } catch (error) {
            console.warn(`${deviceName} fault loop: ${error.message}`);
            if (i === retries - 1) {
                throw new Error(`Link securely broken to ${deviceName}.`);
            }
            await delay(1500);
        }
    }
}

/**
 * Step 1: Connect and hook ActiveLook Device
 */
async function connectEngoStep() {
    try {
        updateStatus("Scanning for ActiveLook Display Ecosystem...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'ENGO' },
                { namePrefix: 'engo' },
                { namePrefix: 'A.Look' },
                { namePrefix: 'A.LooK' }
            ],
            optionalServices: [ENGO_SERVICE_UUID]
        });

        engoTxCharacteristic = await robustConnect(engoDevice, ENGO_SERVICE_UUID, ENGO_TX_CHAR_UUID, "Engo Glasses");
        
        // Push configuration packet sequence to unlock the HUD layer from the "Searching..." screen
        let initPacket = new Uint8Array([0xFF, 0x02, 0x00, 0x05, 0xAA]);
        await engoTxCharacteristic.writeValueWithResponse(initPacket);
        
        isEngoCanvasCleared = false;
        engoDevice.addEventListener('gattserverdisconnected', onEngoDisconnected);

        document.getElementById('btn-engo').innerText = "Engo Connected ✓";
        document.getElementById('btn-engo').disabled = true;
        document.getElementById('btn-stryd').disabled = false;
        updateStatus("Glasses ready. Wake up Stryd Pod and proceed to Step 2.");
    } catch (error) {
        updateStatus("Hardware Connection Failure: " + error.message);
    }
}

/**
 * Step 2: Connect and bind Stryd Data Streams
 */
async function connectStrydStep() {
    try {
        updateStatus("Querying for Footpod broadcast matrix...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'Stryd' },
                { namePrefix: 'STRYD' },
                { namePrefix: 'stryd' }
            ],
            optionalServices: [RSC_SERVICE_UUID, STRYD_LEGACY_SERVICE]
        });

        strydServiceChar = await robustConnect(strydDevice, RSC_SERVICE_UUID, RSC_CHAR_UUID, "Stryd Pod", STRYD_LEGACY_SERVICE);
        strydDevice.addEventListener('gattserverdisconnected', onStrydDisconnected);
        
        await strydServiceChar.startNotifications();
        strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingStrydData);

        document.getElementById('btn-stryd').innerText = "Stryd Connected ✓";
        document.getElementById('btn-stryd').disabled = true;
        updateStatus("System streaming live data straight to HUD.");
    } catch (error) {
        updateStatus("Sensor Hook Failure: " + error.message);
    }
}

async function onEngoDisconnected() {
    updateStatus("HUD connection lost. Executing reconnect loops...");
    try {
        engoTxCharacteristic = await robustConnect(engoDevice, ENGO_SERVICE_UUID, ENGO_TX_CHAR_UUID, "Engo Glasses");
        
        let initPacket = new Uint8Array([0xFF, 0x02, 0x00, 0x05, 0xAA]);
        await engoTxCharacteristic.writeValueWithResponse(initPacket);
        
        isEngoCanvasCleared = false;
        updateStatus("HUD reconnected.");
    } catch (error) {
        updateStatus("HUD reconnect dropped. Reset hardware state manually.");
    }
}

async function onStrydDisconnected() {
    updateStatus("Sensor dropped. Checking telemetry fallback loops...");
    try {
        strydServiceChar = await robustConnect(strydDevice, RSC_SERVICE_UUID, RSC_CHAR_UUID, "Stryd Pod", STRYD_LEGACY_SERVICE);
        updateStatus("Sensor array bound again.");
    } catch (error) {
        updateStatus("Sensor loop broken. Wake pod or restart script.");
    }
}

/**
 * Parse standard GATT RSC parameters + handle interleaved Stryd power bytes
 */
function processIncomingStrydData(event) {
    let dataView = event.target.value;
    let flags = dataView.getUint8(0);
    
    let strideLengthPresent = flags & 0x01;
    let totalDistancePresent = flags & 0x02;
    
    let byteOffset = 1;
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    let paceStr = "--:--";

    if (speedMps > 0.447) {
