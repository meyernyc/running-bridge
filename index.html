<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engo 3 Dynamic Font Tester</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background-color: #121212; color: #ffffff; }
        
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .panel h3 { margin-top: 0; color: #4caf50; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .control-group label { font-size: 14px; color: #ccc; }
        .control-group input { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; text-align: center; width: 120px; font-size: 16px; }
        .control-group input[type="text"] { width: 200px; text-align: left; }
        
        button { background-color: #2196F3; color: white; border: none; padding: 12px 15px; font-size: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        button:active { background-color: #1976D2; }
        button:disabled { opacity: 0.5; cursor: not-allowed; background-color: #555 !important; }
        button.action-btn { background-color: #9C27B0; }
        button.draw-btn { background-color: #4caf50; }
        
        #status { padding: 15px; border-left: 4px solid #FF9800; background: #2a2a2a; font-family: monospace; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Engo 3 Font Sandbox 🧪</h2>
    
    <div id="status">Waiting for connection...</div>

    <button id="btn-connect" onclick="connectEngoGlasses()">1. Connect to Engo</button>
    
    <div class="panel">
        <h3>Font Configuration</h3>
        <div class="control-group">
            <label>Test Text:</label>
            <input type="text" id="input-text" value="350 w">
        </div>
        <div class="control-group">
            <label>Font Size (px):</label>
            <input type="number" id="input-size" value="75" min="10" max="120">
        </div>
        <button id="btn-upload" class="action-btn" onclick="compileAndUploadFont()" disabled>2. Compile & Upload Font</button>
    </div>

    <div class="panel">
        <h3>Display Layout</h3>
        <div class="control-group">
            <label>X Coordinate:</label>
            <input type="number" id="input-x" value="120" min="0" max="304">
        </div>
        <div class="control-group">
            <label>Y Coordinate:</label>
            <input type="number" id="input-y" value="150" min="0" max="256">
        </div>
        <button id="btn-draw" class="draw-btn" onclick="drawTextOnGlasses()" disabled>3. Draw Text on Display</button>
        <button id="btn-clear" onclick="clearDisplay()" style="background-color:#f44336; margin-top:5px;" disabled>Clear Display</button>
    </div>

<script>
let engoRxCharacteristic = null;
const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_RX_CHAR_UUID = '0783b03e-8535-b5a0-7140-a304d2495cba';
const CMD_CLEAR = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 
const TEST_FONT_ID = 0x04; // Saving all tests to slot 0x04

const delay = ms => new Promise(res => setTimeout(res, ms));

function updateStatus(msg) {
    document.getElementById('status').innerText = msg;
}

// --- BLUETOOTH CONNECTION ---
async function connectEngoGlasses() {
    try {
        updateStatus("Scanning for Engo Glasses...");
        const engoDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'ENGO' }, { namePrefix: 'engo' }, { namePrefix: 'A.LooK' }],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Engo Disconnected.");
            toggleButtons(false);
        });
        
        updateStatus("Connecting to ActiveLook engine...");
        const engoServer = await engoDevice.gatt.connect();
        await delay(500); 
        const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
        engoRxCharacteristic = await engoService.getCharacteristic(ENGO_RX_CHAR_UUID);
        
        await clearDisplay();
        
        updateStatus("Glasses Connected! Ready to compile font.");
        document.getElementById('btn-connect').style.backgroundColor = '#555';
        toggleButtons(true);
    } catch (error) {
        updateStatus("Connection Failure: " + error.message);
    }
}

function toggleButtons(enabled) {
    document.getElementById('btn-upload').disabled = !enabled;
    document.getElementById('btn-draw').disabled = !enabled;
    document.getElementById('btn-clear').disabled = !enabled;
}

// --- ACTIVE LOOK TEXT COMMAND ---
function createColorTextCmd(x, y, text, fontId) {
    let textBytes = new TextEncoder().encode(text);
    let totalLen = 13 + textBytes.length; 
    let cmd = new Uint8Array(totalLen);
    cmd[0] = 0xFF; cmd[1] = 0x3E; cmd[2] = 0x00; cmd[3] = totalLen & 0xFF;
    cmd[4] = (x >> 8) & 0xFF; cmd[5] = x & 0xFF; 
    cmd[6] = (y >> 8) & 0xFF; cmd[7] = y & 0xFF;
    cmd[8] = 0x04; // rotation
    cmd[9] = fontId & 0xFF; 
    cmd[10] = 15; // default white
    cmd.set(textBytes, 11);
    cmd[totalLen - 2] = 0x00; cmd[totalLen - 1] = 0xAA; 
    return cmd;
}

async function drawTextOnGlasses() {
    if (!engoRxCharacteristic) return;
    
    let text = document.getElementById('input-text').value;
    let x = parseInt(document.getElementById('input-x').value);
    let y = parseInt(document.getElementById('input-y').value);

    try {
        await clearDisplay();
        let cmd = createColorTextCmd(x, y, text, TEST_FONT_ID);
        await engoRxCharacteristic.writeValueWithoutResponse(cmd);
        updateStatus(`Drew "${text}" at X:${x} Y:${y}`);
    } catch (e) {
        updateStatus("Draw Failed: " + e.message);
    }
}

async function clearDisplay() {
    if (engoRxCharacteristic) {
        await engoRxCharacteristic.writeValueWithoutResponse(CMD_CLEAR);
    }
}

// --- FONT COMPILER ENGINE ---
function encodeActiveLookChar(pixels, width, height) {
    let stream = [];
    let currentBit = false; 
    let count = 0;
    
    for (let p of pixels) {
        if (p === currentBit) {
            count++;
        } else {
            if (count > 0 || stream.length === 0) stream.push({ val: currentBit, count: count });
            currentBit = p;
            count = 1;
        }
    }
    stream.push({ val: currentBit, count: count });

    if (stream.length > 0 && stream[0].val === true) stream.unshift({ val: false, count: 0 });
    if (stream.length % 2 !== 0) stream.push({ val: true, count: 0 });

    let bytes = [];
    for (let i = 0; i < stream.length; i += 2) {
        let off = stream[i].count;
        let on = stream[i+1].count;

        while (off > 0 || on > 0) {
            let cOff = Math.min(off, 15);
            let cOn = 0;
            if (cOff === off) cOn = Math.min(on, 15); 
            
            bytes.push((cOff << 4) | cOn);
            off -= cOff;
            on -= cOn;
        }
    }
    return [bytes.length + 2, width, ...bytes];
}

async function compileAndUploadFont() {
    if (!engoRxCharacteristic) return;
    
    let text = document.getElementById('input-text').value;
    let fontSize = parseInt(document.getElementById('input-size').value);
    
    if (!text || text.length === 0) {
        updateStatus("Error: Enter some text first!");
        return;
    }

    // Optimization: Only compile the characters that are in the text box!
    let uniqueChars = Array.from(new Set(text.split('')));
    if (!uniqueChars.includes(' ')) uniqueChars.push(' '); // Always include space

    updateStatus(`Compiling ${fontSize}px font for chars: [${uniqueChars.join('')}]...`);
    document.getElementById('btn-upload').disabled = true;

    // Wait a tick so the UI updates
    await delay(50);

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let charCodes = uniqueChars.map(c => c.charCodeAt(0));
    const firstChar = Math.min(...charCodes);
    const lastChar = Math.max(...charCodes); 

    let charDataMap = {};
    let charDataBuffer = [];
    let currentOffset = 0;

    for (let char of uniqueChars) {
        let width = Math.max(1, Math.ceil(ctx.measureText(char).width));
        if (char === ' ') width = Math.max(4, Math.floor(fontSize / 3)); // Proportional space

        canvas.width = width;
        canvas.height = fontSize;
        ctx.clearRect(0, 0, width, fontSize);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = "white";
        ctx.textBaseline = "top";
        ctx.fillText(char, 0, 0);

        let imgData = ctx.getImageData(0, 0, width, fontSize).data;
        let pixels = [];
        for (let p = 0; p < imgData.length; p += 4) {
            pixels.push(imgData[p+3] > 127); 
        }

        let bytes = encodeActiveLookChar(pixels, width, fontSize);
        
        // Safety truncation for massive fonts exceeding 255 bytes per char
        if (bytes.length > 255) {
            bytes = bytes.slice(0, 255);
            bytes[0] = 255;
        }

        charDataMap[char] = { offset: currentOffset, bytes: bytes };
        currentOffset += bytes.length;
        charDataBuffer.push(...bytes);
    }

    // Build standard ActiveLook font payload
    let payload = [0x02, fontSize, (firstChar >> 8) & 0xFF, firstChar & 0xFF, (lastChar >> 8) & 0xFF, lastChar & 0xFF];
    let spaceOffset = charDataMap[' '].offset;
    
    for (let i = firstChar; i <= lastChar; i++) {
        let char = String.fromCharCode(i);
        let off = charDataMap[char] ? charDataMap[char].offset : spaceOffset;
        payload.push((off >> 8) & 0xFF, off & 0xFF);
    }
    payload.push(...charDataBuffer);

    // Upload to glasses
    let size = payload.length;
    try {
        let init = new Uint8Array([0xFF, 0x51, 0x00, 0x08, TEST_FONT_ID, (size >> 8) & 0xFF, size & 0xFF, 0xAA]);
        await engoRxCharacteristic.writeValueWithResponse(init);
        await delay(100);

        let offset = 0;
        while (offset < size) {
            let chunkData = payload.slice(offset, offset + 220);
            let totalLen = chunkData.length + 5;
            let chunk = new Uint8Array(totalLen);
            chunk[0] = 0xFF; chunk[1] = 0x51;
            chunk[2] = (totalLen >> 8) & 0xFF;
            chunk[3] = totalLen & 0xFF;
            chunk.set(chunkData, 4);
            chunk[totalLen - 1] = 0xAA;
            
            await engoRxCharacteristic.writeValueWithResponse(chunk);
            offset += chunkData.length;
            updateStatus(`Flashing Font to slot 0x04... ${Math.round((offset/size)*100)}%`);
            await delay(40);
        }
        
        updateStatus("Upload Complete! Click 'Draw Text'.");
    } catch (e) {
        updateStatus("Upload Failed: " + e.message);
    } finally {
        document.getElementById('btn-upload').disabled = false;
    }
}
</script>
</body>
</html>
