<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo HUD Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0; background-color: #121212; color: #ffffff; }
        .dashboard { display: flex; justify-content: space-between; margin-top: 30px; padding: 20px; background: #1e1e1e; border-radius: 10px; }
        .metric { text-align: left; }
        .metric-value { font-size: 24px; font-weight: bold; color: #4caf50; }
        .metric-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        button { background-color: #2196F3; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; cursor: width: 100%; font-weight: bold; }
        button:active { background-color: #1976D2; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-left: 4px solid #4caf50; background: #2a2a2a; font-family: monospace; font-size: 14px; }
        .version { font-size: 14px; color: #888; font-weight: normal; margin-left: 10px; }
        .note { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.4; font-style: italic; background: #1e1e1e; padding: 10px; border-radius: 5px; border-left: 3px solid #4caf50;}
        
        /* Added for debugging GATT payloads directly on phone */
        .debug-panel { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #333; font-family: monospace; font-size: 11px; color: #00ff00; border-radius: 5px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Run HUD Setup <span class="version">v2.11 (Engo 3 Color)</span></h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-engo" onclick="connectEngoGlasses()">1. Connect Engo</button>
        <button id="btn-stryd" onclick="connectStrydPod()" disabled style="background-color: #555;">2. Connect Stryd</button>
    </div>
    <div id="status">Waiting to start...</div>
    <div class="note"><strong>Hardware Note:</strong> Configured for ENGO 3 full-color display. Power metric and gauge will render in Green, Distance in White.</div>
    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- W</div>
            <div class="metric-label">Power</div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
    </div>
    
    <div class="debug-panel" id="debug-log">
        [Hardware Stream Logs]<br>
    </div>
<script>
let engoDevice = null;
let strydDevice = null;
let engoRxCharacteristic = null;
let strydServiceChar = null;
let strydPowerChar = null;
let currentPower = 0;
let currentPace = "--:--";
let currentDistance = "0.00";
let isUpdatingHUD = false; 

const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_CHAR_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cba'; 
const RSC_SERVICE_UUID  = 'running_speed_and_cadence'; 
const RSC_CHAR_UUID     = 'rsc_measurement';
const CP_SERVICE_UUID   = 'cycling_power'; 
const CP_CHAR_UUID      = 'cycling_power_measurement';

const CMD_CLEAR      = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 
const CMD_HOLD_ON    = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x00, 0xAA]); 
const CMD_HOLD_FLUSH = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x01, 0xAA]); 

// Generates the text command payload
function createActiveLookTextCmd(x, y, text, fontId = 0x02, colorVal = 0x0F, rot = 0x04) {
    let textBytes = new TextEncoder().encode(text);
    let totalLen = 13 + textBytes.length; 
    let cmd = new Uint8Array(totalLen);
    
    cmd[0] = 0xFF;              
    cmd[1] = 0x37;              
    cmd[2] = 0x00;              
    cmd[3] = totalLen & 0xFF;   
    
    cmd[4] = (x >> 8) & 0xFF;   
    cmd[5] = x & 0xFF;          
    cmd[6] = (y >> 8) & 0xFF;   
    cmd[7] = y & 0xFF;          
    
    cmd[8] = rot & 0xFF;        
    cmd[9] = fontId & 0xFF;     
    cmd[10] = colorVal & 0xFF;  
    
    cmd.set(textBytes, 11);
    
    cmd[totalLen - 2] = 0x00;   
    cmd[totalLen - 1] = 0xAA;   
    
    return cmd;
}

// Global Color Command (Command ID 0x24) - sets paint color for primitives like rectangles
function createActiveLookColorCmd(colorVal) {
    return new Uint8Array([0xFF, 0x24, 0x00, 0x06, colorVal & 0xFF, 0xAA]);
}

// Generates the filled rectangle payload (Command ID 0x35)
function createActiveLookRectfCmd(x0, y0, x1, y1) {
    let cmd = new Uint8Array(13);
    cmd[0] = 0xFF;              
    cmd[1] = 0x35;              // Command ID for rectf
    cmd[2] = 0x00;              
    cmd[3] = 0x0D;              // Total length (13 bytes)
    
    cmd[4] = (x0 >> 8) & 0xFF;   
    cmd[5] = x0 & 0xFF;          
    cmd[6] = (y0 >> 8) & 0xFF;   
    cmd[7] = y0 & 0xFF;          
    
    cmd[8] = (x1 >> 8) & 0xFF;   
    cmd[9] = x1 & 0xFF;          
    cmd[10] = (y1 >> 8) & 0xFF;   
    cmd[11] = y1 & 0xFF; 
    
    cmd[12] = 0xAA;   
    return cmd;
}

function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) statusElement.innerText = msg;
}

function debugLog(msg) {
    const logEl = document.getElementById('debug-log');
    if (logEl) {
        logEl.innerHTML += msg + "<br>";
        logEl.scrollTop = logEl.scrollHeight;
    }
}

const delay = ms => new Promise(res => setTimeout(res, ms));

async function connectEngoGlasses() {
    try {
        updateStatus("Scanning for Engo Glasses...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'ENGO' }, { namePrefix: 'engo' }, { namePrefix: 'A.LooK' }],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Engo Disconnected.");
        });
        
        updateStatus("Connecting to ActiveLook engine...");
        const engoServer = await engoDevice.gatt.connect();
        await delay(1000); 
        const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
        engoRxCharacteristic = await engoService.getCharacteristic(ENGO_CHAR_UUID);
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        await delay(100);
        
        // Initial connection messages (White)
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(294, 226, "LINKED", 0x02, 0x0F));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(294, 181, "Waiting for Stryd...", 0x02, 0x0F));
        
        updateStatus("Glasses connected! Click 'Connect Stryd'.");
        const strydBtn = document.getElementById('btn-stryd');
        strydBtn.disabled = false;
        strydBtn.style.backgroundColor = '#4caf50'; 
    } catch (error) {
        updateStatus("Engo Connection Failure: " + error.message);
    }
}

async function connectStrydPod() {
    try {
        updateStatus("Scanning for Stryd Footpod...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'Stryd' }, { namePrefix: 'STRYD' }, { namePrefix: 'stryd' }],
            optionalServices: [ RSC_SERVICE_UUID, '00001814-0000-1000-8000-00805f9b34fb', CP_SERVICE_UUID ]
        });
        
        strydDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Stryd Disconnected.");
        });
        
        updateStatus("Connecting to Stryd GATT server...");
        const strydServer = await strydDevice.gatt.connect();
        await delay(1000);
        
        let rscService = await strydServer.getPrimaryService(RSC_SERVICE_UUID);
        strydServiceChar = await rscService.getCharacteristic(RSC_CHAR_UUID);
        await strydServiceChar.startNotifications();
        strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingRSC);
        debugLog("RSC Service Bound.");

        try {
            let cpService = await strydServer.getPrimaryService(CP_SERVICE_UUID);
            strydPowerChar = await cpService.getCharacteristic(CP_CHAR_UUID);
            await strydPowerChar.startNotifications();
            strydPowerChar.addEventListener('characteristicvaluechanged', processIncomingCP);
            debugLog("Cycling Power Service Bound.");
        } catch (cpError) {
            debugLog("Warning: Cycling Power binding failed. Relying on RSC appended power.");
        }
        
        updateStatus("Bridge active! Dual GATT streams linked.");
    } catch (error) {
        updateStatus("Stryd Connection Failure: " + error.message);
    }
}

function processIncomingRSC(event) {
    let dataView = event.target.value;
    let flags = dataView.getUint8(0);
    let strideLengthPresent = flags & 0x01;
    let totalDistancePresent = flags & 0x02;
    
    let byteOffset = 1;
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    if (speedMps > 0.447) { 
        let mph = speedMps * 2.23694;
        let decimalPace = 60 / mph;
        let paceMin = Math.floor(decimalPace);
        let paceSec = Math.floor((decimalPace - paceMin) * 60).toString().padStart(2, '0');
        currentPace = `${paceMin}:${paceSec}`;
    } else {
        currentPace = "--:--";
    }
    
    byteOffset += 1;
    if (strideLengthPresent) byteOffset += 2;
    
    if (totalDistancePresent) {
        let totalMeters = dataView.getUint32(byteOffset, true) / 10;
        currentDistance = (totalMeters * 0.000621371).toFixed(2);
        byteOffset += 4;
    }
    
    let pwrRSC = 0;
    if (byteOffset + 1 < dataView.byteLength) {
        pwrRSC = dataView.getUint16(byteOffset, true);
    }
    if (pwrRSC > 0) {
        currentPower = pwrRSC;
    }
    
    updateUI();
}

function processIncomingCP(event) {
    let dataView = event.target.value;
    if (dataView.byteLength >= 4) {
        let pwrCP = dataView.getInt16(2, true);
        if (pwrCP > 0) {
            currentPower = pwrCP;
        }
    }
    updateUI();
}

async function updateUI() {
    // 1. Update web dashboard view
    document.getElementById('view-pwr').innerText = `${currentPower} W`;
    document.getElementById('view-pce').innerText = currentPace;
    document.getElementById('view-dst').innerText = `${currentDistance} mi`;

    // 2. Update HUD
    if (!engoRxCharacteristic || isUpdatingHUD) return;
    isUpdatingHUD = true;
    try {
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_ON);
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        
        const startX = 152; // Centered X coordinate
        
        // --- POWER GAUGE (Top of screen) ---
        // Sets drawing color to Green (0x02) for the gauge primitive
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookColorCmd(0x02)); 
        
        // Assuming 500W is the max for the gauge. Adjust if your max power is higher/lower.
        const maxPower = 500; 
        const barWidth = Math.max(2, Math.min(304, Math.floor((currentPower / maxPower) * 304)));
        
        // Draw the filled rectangle bar from left to right (y: 240-250 clears the bezel)
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookRectfCmd(0, 240, barWidth, 250));

        // --- METRICS ---
        // Top Half Display (Power). Font 4 (large). Color 0x02 (Green).
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(startX, 226, `${currentPower} W`, 0x04, 0x02));
        
        // Bottom Half Display (Distance). Font 2 (default). Color 0x0F (White).
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(startX, 136, `${currentDistance} mi`, 0x02, 0x0F));
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_FLUSH);
    } catch (bleWriteError) {
        debugLog("Warning: Frame drop.");
    } finally {
        isUpdatingHUD = false;
    }
}
</script>
</body>
</html>
