<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo HUD Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0; background-color: #121212; color: #ffffff; }
        .dashboard { display: flex; justify-content: space-between; margin-top: 30px; padding: 20px; background: #1e1e1e; border-radius: 10px; }
        .metric { text-align: left; }
        .metric-value { font-size: 24px; font-weight: bold; color: #4caf50; }
        .metric-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        button { background-color: #2196F3; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background-color: #1976D2; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-left: 4px solid #FF9800; background: #2a2a2a; font-family: monospace; font-size: 14px; }
        .version { font-size: 14px; color: #888; font-weight: normal; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>Run HUD Setup <span class="version">v2.5 (Optical Flip)</span></h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-engo" onclick="connectEngoGlasses()">1. Connect Engo</button>
        <button id="btn-stryd" onclick="connectStrydPod()" disabled style="background-color: #555;">2. Connect Stryd</button>
    </div>
    <div id="status">Waiting to start...</div>

    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- W</div>
            <div class="metric-label">Power</div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
    </div>

<script>
let engoDevice = null;
let strydDevice = null;
let engoRxCharacteristic = null;
let strydServiceChar = null;
let isEngoCanvasCleared = false; 

const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_CHAR_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cba'; 
const RSC_SERVICE_UUID  = 'running_speed_and_cadence'; 
const RSC_CHAR_UUID     = 'rsc_measurement';

const CMD_CLEAR      = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 
const CMD_HOLD_ON    = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x00, 0xAA]); 
const CMD_HOLD_FLUSH = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x01, 0xAA]); 

/**
 * Validated ActiveLook® Binary Text Command Encoder 
 * Now with 'rot' defaulting to 0x04 to compensate for Engo mirror optics
 */
function createActiveLookTextCmd(x, y, text, fontId = 0x02, colorVal = 0x0F, rot = 0x04) {
    let textBytes = new TextEncoder().encode(text);
    let totalLen = 13 + textBytes.length; 
    let cmd = new Uint8Array(totalLen);
    
    cmd[0] = 0xFF;              
    cmd[1] = 0x37;              
    cmd[2] = 0x00;              
    cmd[3] = totalLen & 0xFF;   
    
    cmd[4] = (x >> 8) & 0xFF;   
    cmd[5] = x & 0xFF;          
    cmd[6] = (y >> 8) & 0xFF;   
    cmd[7] = y & 0xFF;          
    
    cmd[8] = rot & 0xFF;        // Optical Rotation Fix (0x04 = Upside down in buffer, right-side up in glasses)
    cmd[9] = fontId & 0xFF;     
    cmd[10] = colorVal & 0xFF;  
    
    cmd.set(textBytes, 11);
    
    cmd[totalLen - 2] = 0x00;   
    cmd[totalLen - 1] = 0xAA;   
    
    return cmd;
}

function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) statusElement.innerText = msg;
    console.log("[Bridge Log]: " + msg);
}

const delay = ms => new Promise(res => setTimeout(res, ms));

async function connectEngoGlasses() {
    try {
        updateStatus("Scanning for Engo Glasses...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'ENGO' },
                { namePrefix: 'engo' },
                { namePrefix: 'A.LooK' }
            ],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', onEngoDisconnected);
        await connectEngo();
        
        updateStatus("Glasses connected! Click 'Connect Stryd'.");
        const strydBtn = document.getElementById('btn-stryd');
        strydBtn.disabled = false;
        strydBtn.style.backgroundColor = '#2196F3'; 
    } catch (error) {
        updateStatus("Engo Connection Failure: " + error.message);
    }
}

async function connectStrydPod() {
    try {
        updateStatus("Scanning for Stryd Footpod...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'Stryd' },
                { namePrefix: 'STRYD' },
                { namePrefix: 'stryd' }
            ],
            optionalServices: [
                RSC_SERVICE_UUID,
                '00001814-0000-1000-8000-00805f9b34fb', 
                'cycling_power'                         
            ]
        });
        
        strydDevice.addEventListener('gattserverdisconnected', onStrydDisconnected);
        await connectStryd();
        updateStatus("Bridge active! Ready to run.");
    } catch (error) {
        updateStatus("Stryd Connection Failure: " + error.message);
    }
}

async function initEngoDisplay() {
    if (!engoRxCharacteristic) return;
    try {
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        await delay(100);
        // Start X near 304, Start Y near 256 for top-left rendering via mirror reflection
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(294, 226, "LINKED"));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(294, 196, "Waiting for Stryd..."));
    } catch (error) {
        console.warn("Failed to wake up Engo display: " + error.message);
    }
}

async function connectEngo(retries = 5) {
    updateStatus("Connecting to ActiveLook engine...");
    for (let i = 0; i < retries; i++) {
        try {
            const engoServer = await engoDevice.gatt.connect();
            await delay(1000); 
            const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
            engoRxCharacteristic = await engoService.getCharacteristic(ENGO_CHAR_UUID);
            isEngoCanvasCleared = false; 
            await initEngoDisplay();
            return;
        } catch (error) {
             updateStatus(`Engo GATT fetch retry (${i+1}/${retries})...`);
             await delay(1500);
        }
    }
    throw new Error("Failed to fetch Engo GATT services.");
}

async function connectStryd(retries = 5) {
    updateStatus("Connecting to Stryd Footpod...");
    for (let i = 0; i < retries; i++) {
        try {
            const strydServer = await strydDevice.gatt.connect();
            await delay(1000);
            
            let strydService;
            try {
                strydService = await strydServer.getPrimaryService(RSC_SERVICE_UUID);
            } catch (e) {
                strydService = await strydServer.getPrimaryService('00001814-0000-1000-8000-00805f9b34fb');
            }
            
            strydServiceChar = await strydService.getCharacteristic(RSC_CHAR_UUID);
            await strydServiceChar.startNotifications();
            strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingStrydData);
            return;
        } catch (error) {
             updateStatus(`Stryd GATT fetch retry (${i+1}/${retries})...`);
             await delay(1500);
        }
    }
    throw new Error("Failed to fetch Stryd GATT services.");
}

async function onEngoDisconnected() {
    updateStatus("Engo Glasses disconnected. Reconnecting...");
    try { await connectEngo(); } catch (e) { updateStatus("Engo reconnect failed."); }
}

async function onStrydDisconnected() {
    updateStatus("Stryd Pod disconnected. Reconnecting...");
    try { await connectStryd(); } catch (e) { updateStatus("Stryd reconnect failed."); }
}

function processIncomingStrydData(event) {
    let dataView = event.target.value;
    let flags = dataView.getUint8(0);
    let strideLengthPresent = flags & 0x01;
    let totalDistancePresent = flags & 0x02;
    
    let byteOffset = 1;
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    let paceStr = "--:--";
    
    if (speedMps > 0.447) { 
        let mph = speedMps * 2.23694;
        let decimalPace = 60 / mph;
        let paceMin = Math.floor(decimalPace);
        let paceSec = Math.floor((decimalPace - paceMin) * 60).toString().padStart(2, '0');
        paceStr = `${paceMin}:${paceSec}`;
    }
    
    byteOffset += 1; 
    if (strideLengthPresent) byteOffset += 2;
    
    let distanceMiles = "0.00";
    if (totalDistancePresent) {
        let totalMeters = dataView.getUint32(byteOffset, true) / 10;
        distanceMiles = (totalMeters * 0.000621371).toFixed(2);
        byteOffset += 4;
    }
    
    let powerWatts = 0;
    if (byteOffset < dataView.byteLength) {
        powerWatts = dataView.getUint16(byteOffset, true);
    }
    
    document.getElementById('view-pwr').innerText = `${powerWatts} W`;
    document.getElementById('view-pce').innerText = paceStr;
    document.getElementById('view-dst').innerText = `${distanceMiles} mi`;
    
    pushLayoutToGlasses(powerWatts, paceStr, distanceMiles);
}

async function pushLayoutToGlasses(pwr, pce, dst) {
    if (!engoRxCharacteristic) return;
    
    let pwrFormatted = `PWR: ${pwr} W`;
    let pceFormatted = `PCE: ${pce}`;
    let dstFormatted = `DST: ${dst} mi`;

    try {
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_ON);

        if (!isEngoCanvasCleared) {
            await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
            isEngoCanvasCleared = true;
        }

        // X = 294 sets text flush against the "Left" side in the optical reflection
        // Y = 226, 196, 166 sets text starting from the "Top" downward in the optical reflection
        const startX = 294;
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(startX, 226, pwrFormatted));
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(startX, 196, pceFormatted));
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(startX, 166, dstFormatted));
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_FLUSH);
        
    } catch (bleWriteError) {
        console.warn("Frame transmission dropped: " + bleWriteError.message);
    }
}
</script>
</body>
</html>
