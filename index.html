<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo 3 HUD Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0; background-color: #121212; color: #ffffff; }
        .dashboard { display: flex; justify-content: space-between; margin-top: 20px; padding: 20px; background: #1e1e1e; border-radius: 10px; }
        .metric { text-align: left; }
        .metric-value { font-size: 24px; font-weight: bold; color: #4caf50; }
        .metric-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .config-panel { margin-top: 20px; padding: 15px; background: #1e1e1e; border-radius: 10px; }
        .config-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; justify-content: space-between; }
        .config-row label { font-size: 13px; color: #ccc; flex: 1; }
        .config-row input { width: 70px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; text-align: center; }
        
        button { background-color: #2196F3; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background-color: #1976D2; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #status { margin-top: 20px; padding: 15px; border-left: 4px solid #FF9800; background: #2a2a2a; font-family: monospace; font-size: 14px; }
        .version { font-size: 14px; color: #888; font-weight: normal; margin-left: 10px; }
        .debug-panel { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #333; font-family: monospace; font-size: 11px; color: #00ff00; border-radius: 5px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Engo 3 Setup <span class="version">v2.25 (Power Gauge Integration)</span> 🌟</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-engo" onclick="connectEngoGlasses()">1. Connect Engo</button>
        <button id="btn-stryd" onclick="connectStrydPod()" disabled style="background-color: #555;">2. Connect Stryd</button>
    </div>
    
    <div class="config-panel">
        <h3 style="margin-top:0; font-size:15px; color:#4caf50;">Power Range Configuration</h3>
        <div class="config-row">
            <label>Target Power Range (Green inside, Bright Red outside):</label>
            <input type="number" id="pwr-min" value="200"> to <input type="number" id="pwr-max" value="250">
        </div>
        <div class="config-row">
            <label>Max Power for Gauge (100% scale):</label>
            <input type="number" id="pwr-scale" value="400">
        </div>
    </div>
    
    <div id="status">Waiting to start...</div>
    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- W</div>
            <div class="metric-label">Power</div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
        <div class="metric">
            <div id="view-tim" class="metric-value">0:00</div>
            <div class="metric-label">Time</div>
        </div>
    </div>
    
    <div class="debug-panel" id="debug-log">
        [Hardware Stream Logs]<br>
    </div>
<script>
let engoDevice = null;
let strydDevice = null;
let engoRxCharacteristic = null;
let strydServiceChar = null;
let strydPowerChar = null;
let currentPower = 0;
let currentPace = "--:--";
let currentDistance = "0.00";
let isUpdatingHUD = false; 
let isGaugeInitialized = false;

let movingTimeMilli = 0;
let lastRscTime = 0;
let currentMovingTimeStr = "0:00";

const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_CHAR_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cba'; 
const RSC_SERVICE_UUID  = 'running_speed_and_cadence'; 
const RSC_CHAR_UUID     = 'rsc_measurement';
const CP_SERVICE_UUID   = 'cycling_power'; 
const CP_CHAR_UUID      = 'cycling_power_measurement';

const CMD_CFG_WRITE  = new Uint8Array([0xFF, 0x20, 0x00, 0x04, 0xAA]); // Required before gauge save
const CMD_CLEAR      = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 
const CMD_HOLD_ON    = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x00, 0xAA]); 
const CMD_HOLD_FLUSH = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x01, 0xAA]); 

const COLOR_DEFAULT_WHITE = 15;
const COLOR_BRIGHT_RED = 0x3C;
const COLOR_GREEN = 0xFF;

function formatTime(ms) {
    let totalSec = Math.floor(ms / 1000);
    let h = Math.floor(totalSec / 3600);
    let m = Math.floor((totalSec % 3600) / 60);
    let s = totalSec % 60;
    if (h > 0) {
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function createActiveLookColorTextCmd(x, y, text, fontId = 0x02, colorVal = 0x0F, rot = 0x04) {
    let textBytes = new TextEncoder().encode(text);
    let totalLen = 13 + textBytes.length; 
    let cmd = new Uint8Array(totalLen);
    
    cmd[0] = 0xFF;              
    cmd[1] = 0x3E;              
    cmd[2] = 0x00;              
    cmd[3] = totalLen & 0xFF;   
    
    cmd[4] = (x >> 8) & 0xFF;   
    cmd[5] = x & 0xFF;          
    cmd[6] = (y >> 8) & 0xFF;   
    cmd[7] = y & 0xFF;          
    
    cmd[8] = rot & 0xFF;        
    cmd[9] = fontId & 0xFF;     
    cmd[10] = colorVal & 0xFF;  
    
    cmd.set(textBytes, 11);
    
    cmd[totalLen - 2] = 0x00;   
    cmd[totalLen - 1] = 0xAA;   
    
    return cmd;
}

// Generates gaugeSave command (Cmd ID: 0x71)
// Parameters: id=1, x=151, y=127, rExt=110, rIn=75, firstPortion=3, lastPortion=14, clockwise=1
function createGaugeSaveCmd() {
    let cmd = new Uint8Array(17);
    cmd[0] = 0xFF;
    cmd[1] = 0x71; // gaugeSave
    cmd[2] = 0x00;
    cmd[3] = 0x11; // length 17
    
    cmd[4] = 0x01; // gauge id (1)
    
    // x = 151 (0x0097)
    cmd[5] = 0x00; cmd[6] = 0x97;
    // y = 127 (0x007F)
    cmd[7] = 0x00; cmd[8] = 0x7F;
    // rExt = 110 (0x006E)
    cmd[9] = 0x00; cmd[10] = 0x6E;
    // rIn = 75 (0x004B)
    cmd[11] = 0x00; cmd[12] = 0x4B;
    
    cmd[13] = 0x03; // first portion (3)
    cmd[14] = 0x0E; // last portion (14)
    cmd[15] = 0x01; // clockwise (1)
    
    cmd[16] = 0xAA; // End ID
    return cmd;
}

// Generates gaugeDisplay command (Cmd ID: 0x70)
function createGaugeDisplayCmd(gaugeId, percent) {
    let clampedPercent = Math.min(Math.max(Math.round(percent), 0), 100);
    let cmd = new Uint8Array(7);
    cmd[0] = 0xFF;
    cmd[1] = 0x70; // gaugeDisplay
    cmd[2] = 0x00;
    cmd[3] = 0x07; // length 7
    
    cmd[4] = gaugeId & 0xFF;
    cmd[5] = clampedPercent & 0xFF;
    
    cmd[6] = 0xAA; // End ID
    return cmd;
}

function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) statusElement.innerText = msg;
}

function debugLog(msg) {
    const logEl = document.getElementById('debug-log');
    if (logEl) {
        logEl.innerHTML += msg + "<br>";
        logEl.scrollTop = logEl.scrollHeight;
    }
}

const delay = ms => new Promise(res => setTimeout(res, ms));

async function connectEngoGlasses() {
    try {
        updateStatus("Scanning for Engo Glasses...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'ENGO' }, { namePrefix: 'engo' }, { namePrefix: 'A.LooK' }],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Engo Disconnected.");
            isGaugeInitialized = false;
        });
        
        updateStatus("Connecting to ActiveLook engine...");
        const engoServer = await engoDevice.gatt.connect();
        await delay(1000); 
        const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
        engoRxCharacteristic = await engoService.getCharacteristic(ENGO_CHAR_UUID);
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        await delay(100);
        
        // Initialize and save gauge on connect (cfgWrite required first)
        debugLog("Uploading Gauge configuration...");
        await engoRxCharacteristic.writeValueWithResponse(CMD_CFG_WRITE);
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createGaugeSaveCmd());
        await delay(100);
        isGaugeInitialized = true;

        await engoRxCharacteristic.writeValueWithResponse(createActiveLookColorTextCmd(294, 226, "LINKED", 0x02, 0xFF));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookColorTextCmd(294, 181, "Waiting for Stryd...", 0x02, 0xFF));
        
        updateStatus("Glasses connected! Click 'Connect Stryd'.");
        
        const strydBtn = document.getElementById('btn-stryd');
        strydBtn.disabled = false;
        strydBtn.style.backgroundColor = '#2196F3'; 
    } catch (error) {
        updateStatus("Engo Connection Failure: " + error.message);
    }
}

function getPowerColor(power) {
    if (power <= 0 || isNaN(power)) return COLOR_DEFAULT_WHITE;

    let pwrMin = parseInt(document.getElementById('pwr-min').value) || 200;
    let pwrMax = parseInt(document.getElementById('pwr-max').value) || 250;

    if (power >= pwrMin && power <= pwrMax) {
        return COLOR_GREEN;       
    } else {
        return COLOR_BRIGHT_RED;  
    }
}

async function connectStrydPod() {
    try {
        updateStatus("Scanning for Stryd Footpod...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'Stryd' }, { namePrefix: 'STRYD' }, { namePrefix: 'stryd' }],
            optionalServices: [ RSC_SERVICE_UUID, '00001814-0000-1000-8000-00805f9b34fb', CP_SERVICE_UUID ]
        });
        
        strydDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Stryd Disconnected.");
        });
        
        updateStatus("Connecting to Stryd GATT server...");
        const strydServer = await strydDevice.gatt.connect();
        await delay(1000);
        
        let rscService = await strydServer.getPrimaryService(RSC_SERVICE_UUID);
        strydServiceChar = await rscService.getCharacteristic(RSC_CHAR_UUID);
        await strydServiceChar.startNotifications();
        strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingRSC);
        debugLog("RSC Service Bound.");

        try {
            let cpService = await strydServer.getPrimaryService(CP_SERVICE_UUID);
            strydPowerChar = await cpService.getCharacteristic(CP_CHAR_UUID);
            await strydPowerChar.startNotifications();
            strydPowerChar.addEventListener('characteristicvaluechanged', processIncomingCP);
            debugLog("Cycling Power Service Bound.");
        } catch (cpError) {
            debugLog("Warning: Cycling Power binding failed. Relying on RSC appended power.");
        }
        
        updateStatus("Bridge active! Dual GATT streams linked.");
    } catch (error) {
        updateStatus("Stryd Connection Failure: " + error.message);
    }
}

function processIncomingRSC(event) {
    let now = Date.now();
    if (lastRscTime === 0) lastRscTime = now;
    let delta = now - lastRscTime;
    if (delta > 2000) delta = 1000; 
    lastRscTime = now;

    let dataView = event.target.value;
    let flags = dataView.getUint8(0);
    let strideLengthPresent = flags & 0x01;
    let totalDistancePresent = flags & 0x02;
    
    let byteOffset = 1;
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    if (speedMps > 0.447) { 
        let mph = speedMps * 2.23694;
        let decimalPace = 60 / mph;
        let paceMin = Math.floor(decimalPace);
        let paceSec = Math.floor((decimalPace - paceMin) * 60).toString().padStart(2, '0');
        currentPace = `${paceMin}:${paceSec}`;
        movingTimeMilli += delta;
    } else {
        currentPace = "--:--";
        currentPower = 0; 
    }
    
    currentMovingTimeStr = formatTime(movingTimeMilli);
    
    byteOffset += 1;
    if (strideLengthPresent) byteOffset += 2;
    
    if (totalDistancePresent) {
        let totalMeters = dataView.getUint32(byteOffset, true) / 10;
        currentDistance = (totalMeters * 0.000621371).toFixed(2);
        byteOffset += 4;
    }
    
    let pwrRSC = 0;
    if (byteOffset + 1 < dataView.byteLength) {
        pwrRSC = dataView.getUint16(byteOffset, true);
    }
    
    if (pwrRSC >= 0 && speedMps > 0.447) {
        currentPower = pwrRSC;
    } else {
        currentPower = 0;
    }
    
    updateUI();
}

function processIncomingCP(event) {
    let dataView = event.target.value;
    if (dataView.byteLength >= 4) {
        let pwrCP = dataView.getInt16(2, true);
        if (pwrCP >= 0) {
            currentPower = pwrCP;
        } else {
            currentPower = 0;
        }
    }
    updateUI();
}

async function updateUI() {
    document.getElementById('view-pwr').innerText = `${currentPower} W`;
    document.getElementById('view-pce').innerText = currentPace;
    document.getElementById('view-dst').innerText = `${currentDistance} mi`;
    document.getElementById('view-tim').innerText = currentMovingTimeStr;

    if (!engoRxCharacteristic || isUpdatingHUD) return;
    isUpdatingHUD = true;
    try {
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_ON);
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        
        let powerColor = getPowerColor(currentPower);
        
        // Render Gauge if initialized
        if (isGaugeInitialized) {
            let maxScale = parseFloat(document.getElementById('pwr-scale').value) || 400;
            let percent = (currentPower / maxScale) * 100;
            await engoRxCharacteristic.writeValueWithResponse(createGaugeDisplayCmd(1, percent));
        }

        // Power text value in center
        await engoRxCharacteristic.writeValueWithResponse(
            createActiveLookColorTextCmd(152, 226, `${currentPower} W`, 0x04, powerColor)
        );
        
        // Distance & Time secondary line
        await engoRxCharacteristic.writeValueWithResponse(
            createActiveLookColorTextCmd(170, 136, `${currentDistance} mi | ${currentMovingTimeStr}`, 0x01, 0xFF)
        );
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_HOLD_FLUSH);
    } catch (bleWriteError) {
        debugLog("Warning: Frame drop.");
    } finally {
        isUpdatingHUD = false;
    }
}
</script>
</body>
</html>
