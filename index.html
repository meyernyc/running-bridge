<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo 3 HUD Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0; background-color: #121212; color: #ffffff; }
        .dashboard { display: flex; justify-content: space-between; margin-top: 20px; padding: 20px; background: #1e1e1e; border-radius: 10px; flex-wrap: wrap; }
        .metric { text-align: left; margin-bottom: 10px; min-width: 80px; }
        .metric-value { font-size: 24px; font-weight: bold; color: #4caf50; }
        #view-pwr { font-size: 36px; } 
        .metric-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .metric-subtext { font-size: 10px; color: #777; margin-top: 4px; }
        
        .config-panel { margin-top: 20px; padding: 15px; background: #1e1e1e; border-radius: 10px; overflow-x: auto; }
        .config-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; justify-content: flex-start; white-space: nowrap; }
        .config-row label { font-size: 13px; color: #ccc; min-width: 45px; }
        .config-row input[type="number"] { width: 50px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; text-align: center; }
        
        /* Slider Styling */
        input[type=range] { -webkit-appearance: none; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; height: 8px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #4caf50; cursor: pointer; }
        
        .btn-small { padding: 6px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .add-btn { background-color: #4caf50; color: white; margin-top: 5px; }
        .remove-btn { background-color: #f44336; color: white; margin-left: 5px; }
        
        button.main-btn { background-color: #2196F3; color: white; border: none; padding: 15px 15px; font-size: 15px; border-radius: 5px; cursor: pointer; flex-grow: 1; font-weight: bold; }
        button.main-btn:active { background-color: #1976D2; }
        button.main-btn:disabled { opacity: 0.5; cursor: not-allowed; background-color: #555 !important; }
        
        #status { margin-top: 20px; padding: 15px; border-left: 4px solid #FF9800; background: #2a2a2a; font-family: monospace; font-size: 14px; }
        .version { font-size: 14px; color: #888; font-weight: normal; margin-left: 10px; }
        .debug-panel { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #333; font-family: monospace; font-size: 11px; color: #00ff00; border-radius: 5px; height: 140px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Engo 3 Setup <span class="version">v5.6</span> 🚀</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-engo" class="main-btn" onclick="connectEngoGlasses()">1. Connect Engo</button>
        <button id="btn-stryd" class="main-btn" onclick="connectStrydPod()" disabled>2. Connect Stryd</button>
    </div>
    
    <div class="config-panel">
        <h3 style="margin-top:0; font-size:15px; color:#4caf50;">Workout Plan 🎯</h3>
        <div id="workout-rows">
            <div class="config-row workout-row">
                <label class="step-label">Step 1:</label>
                <input type="number" class="w-min" value="200" title="Min Power"> to 
                <input type="number" class="w-max" value="250" title="Max Power"> w, 
                <input type="number" class="w-time" value="10" title="Minutes"> m,
                <input type="number" class="w-countdown" value="30" title="Countdown Sec"> s cd
                <button class="btn-small remove-btn" onclick="removeRow(this)" style="visibility:hidden;">X</button>
            </div>
            <div class="config-row workout-row">
                <label class="step-label">Step 2:</label>
                <input type="number" class="w-min" value="260" title="Min Power"> to 
                <input type="number" class="w-max" value="300" title="Max Power"> w, 
                <input type="number" class="w-time" value="5" title="Minutes"> m,
                <input type="number" class="w-countdown" value="15" title="Countdown Sec"> s cd
                <button class="btn-small remove-btn" onclick="removeRow(this)">X</button>
            </div>
        </div>
        <button class="btn-small add-btn" onclick="addWorkoutRow()">+ Add Step</button>
    </div>

    <!-- HUD Settings Panel -->
    <div class="config-panel">
        <h3 style="margin-top:0; font-size:15px; color:#4caf50;">HUD Settings ⚙️</h3>
        <div class="config-row">
            <label style="min-width:125px;">Brightness:</label>
            <input type="range" id="brightness-slider" min="0" max="15" value="15" 
                   oninput="document.getElementById('brightness-val').innerText = this.value; updateBrightnessDebounced(this.value);" 
                   style="flex-grow:1; margin: 0 10px;">
            <span id="brightness-val" style="min-width:20px; text-align:right; font-weight:bold;">15</span>
        </div>
    </div>
    
    <div id="status">Waiting to start...</div>
    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- w</div>
            <div class="metric-label">Power</div>
            <div id="view-pwr-range" class="metric-subtext">200 - 250 w</div>
            <div id="view-next" class="metric-subtext" style="color: #ff9800; font-weight: bold;"></div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
        <div class="metric">
            <div id="view-tim" class="metric-value">0:00</div>
            <div class="metric-label">Time</div>
        </div>
    </div>
    
    <div class="debug-panel" id="debug-log">
        [Hardware Stream Logs]<br>
    </div>

<script>
let engoDevice = null;
let strydDevice = null;
let engoRxCharacteristic = null;
let engoControlCharacteristic = null;
let strydServiceChar = null;
let strydPowerChar = null;
let currentPower = 0;
let currentPace = "--:--";
let currentDistance = "0.00";
let isUpdatingHUD = false; 
let isDisplayReady = false; // true once the glasses are connected & initial setup is done

let movingTimeMilli = 0;
let lastRscTime = 0;
let currentMovingTimeStr = "0:00";

let wakeLock = null; // Wake Lock Sentinel

const ENGO_SERVICE_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_RX_CHAR_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cba';
const ENGO_CONTROL_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cb9';
const RSC_SERVICE_UUID  = 'running_speed_and_cadence'; 
const RSC_CHAR_UUID     = 'rsc_measurement';
const CP_SERVICE_UUID   = 'cycling_power'; 
const CP_CHAR_UUID      = 'cycling_power_measurement';

const CFG_NAME     = "RunHUD";
const CFG_PASSWORD = 0;
let cfgVersion = 1;

const CMD_CLEAR      = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 
const CMD_HOLD_ON    = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x00, 0xAA]); 
const CMD_HOLD_FLUSH = new Uint8Array([0xFF, 0x39, 0x00, 0x06, 0x01, 0xAA]); 
    
// Turn off ONLY auto-brightness (Command 0x22), keeping gestures active
// Data length is 1 byte for this command
const CMD_SENSOR_OFF = new Uint8Array([0xFF, 0x22, 0x00, 0x01, 0x00, 0xAA]); 
    
const COLOR_DEFAULT_WHITE = 15;
const COLOR_BRIGHT_RED = 0x3C;
const COLOR_GREEN = 0xC3;

// ----------------- PROGRESS ARC GEOMETRY ----------------- //
// Replaces the old ActiveLook "gauge" object (which has a fixed,
// non-configurable color) with a hand-drawn arc, which respects
// the color (0x30) command like every other primitive shape.
const ARC_CENTER_X   = 151; // roughly screen center (was gauge x)
const ARC_CENTER_Y   = 147; // roughly screen center (was gauge y)
const ARC_RADIUS     = 123; // midpoint of old gauge outer(110)/inner(102) radii
const ARC_THICKNESS  = 8;   // ring thickness in pixels
const ARC_START_ANGLE = -90; // 0deg = 3 o'clock, increasing clockwise -> -90 = 12 o'clock (top)

function formatTime(ms) {
    let totalSec = Math.floor(ms / 1000);
    let h = Math.floor(totalSec / 3600);
    let m = Math.floor((totalSec % 3600) / 60);
    let s = totalSec % 60;
    if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function updateRowLabels() {
    const rows = document.querySelectorAll('.workout-row');
    rows.forEach((row, index) => {
        row.querySelector('.step-label').innerText = `Step ${index + 1}:`;
        let btn = row.querySelector('.remove-btn');
        if(index === 0 && rows.length === 1) {
            btn.style.visibility = 'hidden';
        } else {
            btn.style.visibility = 'visible';
        }
    });
}

function addWorkoutRow() {
    const container = document.getElementById('workout-rows');
    const row = document.createElement('div');
    row.className = 'config-row workout-row';
    row.innerHTML = `
        <label class="step-label">Step X:</label>
        <input type="number" class="w-min" value="200" title="Min Power"> to 
        <input type="number" class="w-max" value="250" title="Max Power"> w, 
        <input type="number" class="w-time" value="5" title="Minutes"> m,
        <input type="number" class="w-countdown" value="30" title="Countdown Sec"> s cd
        <button class="btn-small remove-btn" onclick="removeRow(this)">X</button>
    `;
    container.appendChild(row);
    updateRowLabels();
}

function removeRow(btn) {
    btn.parentElement.remove();
    updateRowLabels();
}

function getCurrentStepInfo() {
    let rows = document.querySelectorAll('.workout-row');
    let elapsed = movingTimeMilli;
    let current = { min: 0, max: 0, duration: 0, remaining: 0, countdownSec: 0, nextText: "Done" };

    for (let i = 0; i < rows.length; i++) {
        let rMin = parseInt(rows[i].querySelector('.w-min').value) || 0;
        let rMax = parseInt(rows[i].querySelector('.w-max').value) || 0;
        let rTime = (parseFloat(rows[i].querySelector('.w-time').value) || 0) * 60 * 1000;
        let rCountdown = parseInt(rows[i].querySelector('.w-countdown').value) || 0;

        if (elapsed < rTime) {
            current.min = rMin;
            current.max = rMax;
            current.duration = rTime;
            current.countdownSec = rCountdown;
            current.remaining = rTime - elapsed;
            
            if (i + 1 < rows.length) {
                let nMin = parseInt(rows[i+1].querySelector('.w-min').value) || 0;
                let nMax = parseInt(rows[i+1].querySelector('.w-max').value) || 0;
                let nTime = parseFloat(rows[i+1].querySelector('.w-time').value) || 0;
                current.nextText = `${nMin} - ${nMax}w @ ${nTime}m`;
            }
            return current;
        } else {
            elapsed -= rTime; 
        }
    }
    let lastRow = rows[rows.length - 1];
    if (lastRow) {
        current.min = parseInt(lastRow.querySelector('.w-min').value) || 0;
        current.max = parseInt(lastRow.querySelector('.w-max').value) || 0;
        current.countdownSec = parseInt(lastRow.querySelector('.w-countdown').value) || 0;
    }
    current.duration = 1;
    current.remaining = 0;
    return current;
}

// ----------------- ACTIVELOOK COMMANDS ----------------- //

// Sets the grey level (0-15) used to draw the next graphical element.
// This is what actually controls the color of the arc drawn below.
function createColorCmd(colorVal) {
    return new Uint8Array([0xFF, 0x30, 0x00, 0x06, colorVal & 0xFF, 0xAA]);
}

// Wraps a signed 16-bit value into its two-byte big-endian, two's-complement form.
function s16Bytes(val) {
    let v = val & 0xFFFF;
    return [(v >> 8) & 0xFF, v & 0xFF];
}

// Draws an arc (ring segment) at (x,y) with radius r and given thickness.
// Angles are in degrees: 0deg = 3 o'clock, increasing clockwise.
function createArcCmd(x, y, r, angleStart, angleEnd, thickness) {
    let [xHi, xLo] = s16Bytes(x);
    let [yHi, yLo] = s16Bytes(y);
    let [asHi, asLo] = s16Bytes(Math.round(angleStart));
    let [aeHi, aeLo] = s16Bytes(Math.round(angleEnd));
    return new Uint8Array([
        0xFF, 0x3C, 0x00, 0x0F,
        xHi, xLo,
        yHi, yLo,
        r & 0xFF,
        asHi, asLo,
        aeHi, aeLo,
        thickness & 0xFF,
        0xAA
    ]);
}

function createActiveLookColorTextCmd(x, y, text, textLength, fontId = 0x02, colorVal = 0x0F, rot = 0x04) {
    let textBytes = new TextEncoder().encode(text);
    let safeLength = Math.min(textBytes.length, textLength);
    let totalLen = 13 + safeLength; 
    let cmd = new Uint8Array(totalLen);
    cmd[0] = 0xFF; cmd[1] = 0x3E; cmd[2] = 0x00; cmd[3] = totalLen & 0xFF;
    cmd[4] = (x >> 8) & 0xFF; cmd[5] = x & 0xFF; cmd[6] = (y >> 8) & 0xFF; cmd[7] = y & 0xFF;
    cmd[8] = rot & 0xFF; cmd[9] = fontId & 0xFF; cmd[10] = colorVal & 0xFF;
    cmd.set(textBytes.slice(0, safeLength), 11);
    cmd[totalLen - 2] = 0x00; cmd[totalLen - 1] = 0xAA; 
    return cmd;
}

async function sendThickText(char, x, y, text, fontId, colorVal, withResponse = false) {
    let cmd1 = createActiveLookColorTextCmd(x, y, text, text.length, fontId, colorVal);
    let cmd2 = createActiveLookColorTextCmd(x + 1, y, text, text.length, fontId, colorVal);
    
    if (withResponse) {
        await char.writeValueWithResponse(cmd1);
        await char.writeValueWithResponse(cmd2);
    } else {
        await char.writeValueWithoutResponse(cmd1);
        await char.writeValueWithoutResponse(cmd2);
    }
}

function createCfgWriteCmd(name, version, password) {
    let nameBytes = new TextEncoder().encode(name).slice(0, 11);
    let totalLen = 4 + (nameBytes.length + 1) + 8 + 1;
    let cmd = new Uint8Array(totalLen);
    cmd[0] = 0xFF; cmd[1] = 0xD0; cmd[2] = 0x00; cmd[3] = totalLen & 0xFF;
    let offset = 4;
    cmd.set(nameBytes, offset); offset += nameBytes.length; cmd[offset] = 0x00; offset += 1;
    cmd[offset] = (version >>> 24) & 0xFF; cmd[offset + 1] = (version >>> 16) & 0xFF; cmd[offset + 2] = (version >>> 8) & 0xFF; cmd[offset + 3] = version & 0xFF; offset += 4;
    cmd[offset] = (password >>> 24) & 0xFF; cmd[offset + 1] = (password >>> 16) & 0xFF; cmd[offset + 2] = (password >>> 8) & 0xFF; cmd[offset + 3] = password & 0xFF; offset += 4;
    cmd[offset] = 0xAA;
    return cmd;
}

// ----------------- WAKE LOCK LOGIC ----------------- //

async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                debugLog("Wake Lock Released");
            });
            debugLog("Wake Lock Acquired");
        } catch (err) {
            debugLog("Wake Lock Error: " + err.message);
        }
    } else {
        debugLog("Wake Lock API not supported in this browser");
    }
}

document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
    }
});

// ----------------- BLUETOOTH CONNECTION & BRIGHTNESS LOGIC ----------------- //

function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) statusElement.innerText = msg;
}

function debugLog(msg) {
    const logEl = document.getElementById('debug-log');
    if (logEl) {
        logEl.innerHTML += msg + "<br>";
        logEl.scrollTop = logEl.scrollHeight;
    }
}

const delay = ms => new Promise(res => setTimeout(res, ms));

let brightnessTimeout = null;
function updateBrightnessDebounced(level) {
    if (brightnessTimeout) clearTimeout(brightnessTimeout);
    brightnessTimeout = setTimeout(() => {
        updateBrightness(level);
    }, 200); 
}

async function updateBrightness(level) {
    if (!engoRxCharacteristic) return;
    
    // Wait if the HUD is currently drawing text/arc to prevent a BLE collision
    while (isUpdatingHUD) {
        await delay(50);
    }
    
    // Lock the BLE characteristic so updateUI() doesn't interrupt us
    isUpdatingHUD = true; 
    
    try {
        let numLevel = parseInt(level);
        
        // Force the Ambient Light Sensor off again just in case the glasses re-enabled it
        let cmdAlsOff = new Uint8Array([0xFF, 0x22, 0x00, 0x01, 0x00, 0xAA]);
        await engoRxCharacteristic.writeValueWithResponse(cmdAlsOff);
        await delay(25);
        
        // Send the new brightness level using WithResponse to guarantee acknowledgment
        let cmdBrightness = new Uint8Array([0xFF, 0x10, 0x00, 0x01, numLevel, 0xAA]);
        await engoRxCharacteristic.writeValueWithResponse(cmdBrightness);
        debugLog("Brightness set to " + numLevel);
        
    } catch (e) {
        debugLog("Failed to update brightness: " + e.message);
    } finally {
        // Unlock the BLE characteristic so the Stryd data can resume updating
        isUpdatingHUD = false; 
    }
}

async function connectEngoGlasses() {
    try {
        await requestWakeLock();

        updateStatus("Scanning for Engo Glasses...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'ENGO' }, { namePrefix: 'engo' }, { namePrefix: 'A.LooK' }],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', () => {
            updateStatus("Engo Disconnected.");
            isDisplayReady = false;
        });
        
        updateStatus("Connecting to ActiveLook engine...");
        const engoServer = await engoDevice.gatt.connect();
        await delay(1000); 
        const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
        engoRxCharacteristic = await engoService.getCharacteristic(ENGO_RX_CHAR_UUID);
        
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        await delay(100);

        // Turn off auto-brightness (but keep gesture)
        await engoRxCharacteristic.writeValueWithResponse(CMD_SENSOR_OFF);
        await delay(50);
        
        // Grab current slider value and apply it upon connection
        let initialBrightness = parseInt(document.getElementById('brightness-slider').value);
        let cmdBrightness = new Uint8Array([0xFF, 0x10, 0x00, 0x01, initialBrightness, 0xAA]);
        await engoRxCharacteristic.writeValueWithResponse(cmdBrightness);
        await delay(50);

        await engoRxCharacteristic.writeValueWithResponse(createCfgWriteCmd(CFG_NAME, cfgVersion, CFG_PASSWORD));
        await delay(200);
        isDisplayReady = true;

        const linkedText = "LINKED";
        await sendThickText(engoRxCharacteristic, 294, 226, linkedText, 0x02, 0xFF, true);
        const waitingText = "Waiting for Stryd...";
        await sendThickText(engoRxCharacteristic, 294, 181, waitingText, 0x02, 0xFF, true);

        updateStatus("Glasses connected! Click 'Connect Stryd'.");
        document.getElementById('btn-engo').style.backgroundColor = '#555';
        document.getElementById('btn-stryd').disabled = false;
        
    } catch (error) {
        updateStatus("Engo Connection Failure: " + error.message);
    }
}

function getPowerColor(power, min, max) {
    if (power <= 0 || isNaN(power)) return COLOR_DEFAULT_WHITE;
    if (power >= min && power <= max) return COLOR_GREEN;        
    return COLOR_DEFAULT_WHITE;  
}

// Grey-level gradient (green -> red) used for the arc while NOT in the
// final countdown window, based on how much of the step remains.
function getProgressArcColor(percent) {
    let clampedPercent = Math.max(0, Math.min(100, percent));
    let ratio = clampedPercent / 100; 
    let topNibble = Math.round(3 + (9 * ratio));   
    let bottomNibble = Math.round(12 - (9 * ratio)); 
    return (topNibble << 4) | bottomNibble;
}

async function connectStrydPod() {
    try {
        updateStatus("Scanning for Stryd Footpod...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'Stryd' }, { namePrefix: 'STRYD' }, { namePrefix: 'stryd' }],
            optionalServices: [ RSC_SERVICE_UUID, '00001814-0000-1000-8000-00805f9b34fb', CP_SERVICE_UUID ]
        });
        
        strydDevice.addEventListener('gattserverdisconnected', () => { updateStatus("Stryd Disconnected."); });
        
        const strydServer = await strydDevice.gatt.connect();
        await delay(1000);
        
        let rscService = await strydServer.getPrimaryService(RSC_SERVICE_UUID);
        strydServiceChar = await rscService.getCharacteristic(RSC_CHAR_UUID);
        await strydServiceChar.startNotifications();
        strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingRSC);
        
        try {
            let cpService = await strydServer.getPrimaryService(CP_SERVICE_UUID);
            strydPowerChar = await cpService.getCharacteristic(CP_CHAR_UUID);
            await strydPowerChar.startNotifications();
            strydPowerChar.addEventListener('characteristicvaluechanged', processIncomingCP);
        } catch (cpError) {}
        
        updateStatus("Bridge active! Dual GATT streams linked.");
        document.getElementById('btn-stryd').style.backgroundColor = '#555';
    } catch (error) {
        updateStatus("Stryd Connection Failure: " + error.message);
    }
}

function processIncomingRSC(event) {
    let now = Date.now();
    if (lastRscTime === 0) lastRscTime = now;
    let delta = now - lastRscTime;
    if (delta > 2000) delta = 1000; 
    lastRscTime = now;

    let dataView = event.target.value;
    let flags = dataView.getUint8(0);
    let byteOffset = 1;
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    if (speedMps > 0.447) { 
        let mph = speedMps * 2.23694;
        let decimalPace = 60 / mph;
        let paceMin = Math.floor(decimalPace);
        let paceSec = Math.floor((decimalPace - paceMin) * 60).toString().padStart(2, '0');
        currentPace = `${paceMin}:${paceSec}`;
        movingTimeMilli += delta;
    } else {
        currentPace = "--:--";
        currentPower = 0; 
    }
    
    currentMovingTimeStr = formatTime(movingTimeMilli);
    
    byteOffset += 1;
    if (flags & 0x01) byteOffset += 2;
    
    if (flags & 0x02) {
        let totalMeters = dataView.getUint32(byteOffset, true) / 10;
        currentDistance = (totalMeters * 0.000621371).toFixed(2);
        byteOffset += 4;
    }
    
    if (byteOffset + 1 < dataView.byteLength) {
        let pwrRSC = dataView.getUint16(byteOffset, true);
        if (pwrRSC >= 0 && speedMps > 0.447) currentPower = pwrRSC;
    }
    updateUI();
}

function processIncomingCP(event) {
    let dataView = event.target.value;
    if (dataView.byteLength >= 4) {
        let pwrCP = dataView.getInt16(2, true);
        if (pwrCP >= 0) currentPower = pwrCP;
    }
    updateUI();
}

async function updateUI() {
    let stepInfo = getCurrentStepInfo();
    
    // Format the remaining time for the current step
    let timeRemainingStr = formatTime(stepInfo.remaining);
    
    // Append the time remaining to the right of the target power
    let rangeText = `${stepInfo.min} - ${stepInfo.max}w  ${timeRemainingStr}`;
    
    let isWorkoutFinished = stepInfo.nextText === "Done";
    let nextText = "";
    
    // Only display next step text if remaining time is 1 minute (60000ms) or less
    if (stepInfo.remaining <= 60000) {
        nextText = isWorkoutFinished ? "        Done" : `${stepInfo.nextText}`;
    }
    
    let nextTextColor = isWorkoutFinished ? COLOR_GREEN : COLOR_DEFAULT_WHITE ;

    document.getElementById('view-pwr').innerText = `${currentPower} w`;
    document.getElementById('view-pce').innerText = currentPace;
    document.getElementById('view-dst').innerText = `${currentDistance} mi`;
    document.getElementById('view-tim').innerText = currentMovingTimeStr;
    document.getElementById('view-pwr-range').innerText = rangeText;
    
    const viewNextEl = document.getElementById('view-next');
    viewNextEl.innerText = nextText;
    viewNextEl.style.color = isWorkoutFinished ? '#ffffff' : '#ff9800';

    // The lock that prevents this function from running if the brightness slider is currently sending commands
    if (!engoRxCharacteristic || isUpdatingHUD) return;
    isUpdatingHUD = true;
    
    try {
        await engoRxCharacteristic.writeValueWithoutResponse(CMD_HOLD_ON);
        await engoRxCharacteristic.writeValueWithoutResponse(CMD_CLEAR);
        
        let powerColor = getPowerColor(currentPower, stepInfo.min, stepInfo.max);
        
        if (isDisplayReady) {
            let percent = 0;
            let countdownMs = stepInfo.countdownSec * 1000;
            let dynamicColor = COLOR_GREEN;

            // Check if we are inside the user-defined countdown window at the end of a step
            if (countdownMs > 0 && stepInfo.remaining <= countdownMs && stepInfo.remaining > 0) {
                // Map the remaining time over the user-entered seconds directly to a 100-0% scale
                percent = (stepInfo.remaining / countdownMs) * 100;
                // Switch the arc color to bright red during the final countdown
                dynamicColor = COLOR_BRIGHT_RED;
            } else {
                // Default step progression display behavior outside of the countdown window
                percent = stepInfo.duration > 0 ? (stepInfo.remaining / stepInfo.duration) * 100 : 0;
                dynamicColor = getProgressArcColor(percent);
            }

            let clampedPercent = Math.min(Math.max(percent, 0), 100);
            
            // To animate a clockwise countdown, fix the end angle at 12 o'clock (270 degrees) 
            // and advance the start angle as time decreases.
            let sweepStartAngle = (ARC_START_ANGLE + 360) - (clampedPercent / 100) * 360;
            let sweepEndAngle = ARC_START_ANGLE + 360; // Fixed at 270 degrees

            // Set the color, then draw the arc — arcs (unlike the old gauge object)
            // actually respect whatever color was set right before them.
            await engoRxCharacteristic.writeValueWithoutResponse(createColorCmd(COLOR_GREEN));
            await engoRxCharacteristic.writeValueWithoutResponse(
                createArcCmd(ARC_CENTER_X, ARC_CENTER_Y, ARC_RADIUS, sweepStartAngle, sweepEndAngle, ARC_THICKNESS)
            );        
        }

        const powerText = `${currentPower}`;
        let cmdPower = createActiveLookColorTextCmd(200, 185, powerText, powerText.length, 0x04, powerColor);
        await engoRxCharacteristic.writeValueWithoutResponse(cmdPower);
        
        const paceText = `${currentPace} /mi`;
        await sendThickText(engoRxCharacteristic, 180, 215, paceText, 0x05, COLOR_GREEN);
        
        await sendThickText(engoRxCharacteristic, 230, 115, rangeText, 0x05, COLOR_GREEN);
        
        // Only send the next text command to HUD if it is populated
        if (nextText !== "") {
            await sendThickText(engoRxCharacteristic, 230, 85, nextText, 0x05, nextTextColor);
        }
        
        const secText = `${currentDistance} mi`;
        await sendThickText(engoRxCharacteristic, 180, 55, secText, 0x05, COLOR_GREEN);
        
        await engoRxCharacteristic.writeValueWithoutResponse(CMD_HOLD_FLUSH);
    } catch (bleWriteError) {
        debugLog("Warning: Frame drop - " + bleWriteError.message);
    } finally {
        isUpdatingHUD = false;
    }
}</script>
