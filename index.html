<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stryd to Engo HUD Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #121212; color: #ffffff; }
        .dashboard { display: flex; justify-content: space-between; margin-top: 30px; padding: 20px; background: #1e1e1e; border-radius: 10px; }
        .metric { text-align: center; }
        .metric-value { font-size: 24px; font-weight: bold; color: #4caf50; }
        .metric-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        button { background-color: #2196F3; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background-color: #1976D2; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-left: 4px solid #FF9800; background: #2a2a2a; font-family: monospace; font-size: 14px; }
        .version { font-size: 14px; color: #888; font-weight: normal; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>Run HUD Setup <span class="version">v1.4</span></h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-engo" onclick="connectEngoGlasses()">1. Connect Engo</button>
        <button id="btn-stryd" onclick="connectStrydPod()" disabled style="background-color: #555;">2. Connect Stryd</button>
    </div>
    <div id="status">Waiting to start...</div>

    <div class="dashboard">
        <div class="metric">
            <div id="view-pwr" class="metric-value">-- W</div>
            <div class="metric-label">Power</div>
        </div>
        <div class="metric">
            <div id="view-pce" class="metric-value">--:--</div>
            <div class="metric-label">Pace</div>
        </div>
        <div class="metric">
            <div id="view-dst" class="metric-value">0.00 mi</div>
            <div class="metric-label">Distance</div>
        </div>
    </div>

<script>
// --- DISPLAY CONFIGURATION ---
const TEXT_ROTATION = 0x02; // 0x02 = 180-degree flip. (Change to 0x00 if it's ever upside down again)
const X_LEFT = 10;          // How far from the left edge the text starts

// Since the screen is flipped, Y grows from bottom to top. 
// Higher numbers = higher up in your vision.
const Y_TOP = 80;  
const Y_MID = 50;  
const Y_BOT = 20;  

// Global tracking variables for the device connection layer
let engoDevice = null;
let strydDevice = null;
let engoRxCharacteristic = null;
let strydServiceChar = null;
let isEngoCanvasCleared = false; 

// Core Service and Data Channel Blueprint Constants
const ENGO_SERVICE_UUID = '0783b03e-8535-b5a0-7140-a304d2495cb7';
const ENGO_CHAR_UUID    = '0783b03e-8535-b5a0-7140-a304d2495cba'; 
const RSC_SERVICE_UUID  = 'running_speed_and_cadence'; 
const RSC_CHAR_UUID     = 'rsc_measurement';

// Pre-compiled Binary Clear Screen Command for ActiveLook API
const CMD_CLEAR = new Uint8Array([0xFF, 0x01, 0x00, 0x05, 0xAA]); 

/**
 * Helper to create an ActiveLook binary text command.
 */
function createActiveLookTextCmd(x, y, text) {
    let textBytes = new TextEncoder().encode(text);
    let totalLen = 12 + textBytes.length;
    let cmd = new Uint8Array(totalLen);
    
    cmd[0] = 0xFF;             // Start byte
    cmd[1] = 0x37;             // Command ID (Text)
    cmd[2] = 0x00;             // Format (No Query ID)
    cmd[3] = totalLen;         // Total command length
    cmd[4] = (x >> 8) & 0xFF;  // X coordinate (MSB)
    cmd[5] = x & 0xFF;         // X coordinate (LSB)
    cmd[6] = (y >> 8) & 0xFF;  // Y coordinate (MSB)
    cmd[7] = y & 0xFF;         // Y coordinate (LSB)
    cmd[8] = TEXT_ROTATION;    // Text Rotation (0x02 for flipped)
    cmd[9] = 0x02;             // Font ID (2 = Medium)
    cmd[10] = 0x0F;            // Color (15 = White)
    
    cmd.set(textBytes, 11);    // Insert text string payload
    
    cmd[totalLen - 2] = 0x00;  // Null terminator for string
    cmd[totalLen - 1] = 0xAA;  // Footer byte
    
    return cmd;
}

/**
 * Visual feedback logger
 */
function updateStatus(msg) {
    const statusElement = document.getElementById('status');
    if (statusElement) {
        statusElement.innerText = msg;
    }
    console.log("[Bridge Log]: " + msg);
}

/**
 * Helper to pause execution
 */
const delay = ms => new Promise(res => setTimeout(res, ms));

/**
 * Step 1: Connect to Engo Glasses
 */
async function connectEngoGlasses() {
    try {
        updateStatus("Scanning for Engo 3 Glasses...");
        engoDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'ENGO' },
                { namePrefix: 'engo' },
                { namePrefix: 'A.LooK' }
            ],
            optionalServices: [ENGO_SERVICE_UUID]
        });
        
        engoDevice.addEventListener('gattserverdisconnected', onEngoDisconnected);
        await connectEngo();
        
        updateStatus("Glasses connected! Now click 'Connect Stryd'.");
        
        // Enable the second button now that the first is connected
        const strydBtn = document.getElementById('btn-stryd');
        strydBtn.disabled = false;
        strydBtn.style.backgroundColor = '#2196F3'; 
        
    } catch (error) {
        updateStatus("Engo Connection Failure: " + error.message);
    }
}

/**
 * Step 2: Connect to Stryd Footpod
 */
async function connectStrydPod() {
    try {
        updateStatus("Scanning for Stryd Footpod (Shake pod to wake)...");
        strydDevice = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'Stryd' },
                { namePrefix: 'STRYD' },
                { namePrefix: 'stryd' }
            ],
            optionalServices: [
                RSC_SERVICE_UUID,
                '00001814-0000-1000-8000-00805f9b34fb', 
                'cycling_power'                         
            ]
        });
        
        strydDevice.addEventListener('gattserverdisconnected', onStrydDisconnected);
        await connectStryd();
        
        updateStatus("Bridge fully active! Ready to run.");
        
    } catch (error) {
        updateStatus("Stryd Connection Failure: " + error.message);
    }
}

/**
 * Wakes up the Engo display and clears the "Searching" screen using Binary Commands
 */
async function initEngoDisplay() {
    if (!engoRxCharacteristic) return;
    
    try {
        // Clear screen
        await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
        await delay(100);
        
        // Write status text (using the top and middle layout rows)
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(X_LEFT, Y_TOP, "LINKED"));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(X_LEFT, Y_MID, "Waiting for Stryd..."));
    } catch (error) {
        console.warn("Failed to wake up Engo display: " + error.message);
    }
}

/**
 * Helper to connect/reconnect to Engo Glasses with retry logic for GATT drops
 */
async function connectEngo(retries = 5) {
    updateStatus("Connecting to ActiveLook engine...");
    for (let i = 0; i < retries; i++) {
        try {
            const engoServer = await engoDevice.gatt.connect();
            await delay(1000); 
            const engoService = await engoServer.getPrimaryService(ENGO_SERVICE_UUID);
            engoRxCharacteristic = await engoService.getCharacteristic(ENGO_CHAR_UUID);
            isEngoCanvasCleared = false; 
            
            // WAKE UP THE SCREEN
            await initEngoDisplay();

            return; // Success
        } catch (error) {
             updateStatus(`Engo GATT fetch failed, retrying (${i+1}/${retries})...`);
             await delay(1500);
        }
    }
    throw new Error("Failed to fetch Engo GATT services after multiple attempts.");
}

/**
 * Helper to connect/reconnect to Stryd Pod with retry logic for GATT drops
 */
async function connectStryd(retries = 5) {
    updateStatus("Connecting to Stryd Footpod...");
    for (let i = 0; i < retries; i++) {
        try {
            const strydServer = await strydDevice.gatt.connect();
            await delay(1000);
            
            let strydService;
            try {
                strydService = await strydServer.getPrimaryService(RSC_SERVICE_UUID);
            } catch (e) {
                strydService = await strydServer.getPrimaryService('00001814-0000-1000-8000-00805f9b34fb');
            }
            
            strydServiceChar = await strydService.getCharacteristic(RSC_CHAR_UUID);
            await strydServiceChar.startNotifications();
            strydServiceChar.addEventListener('characteristicvaluechanged', processIncomingStrydData);
            return; // Success
        } catch (error) {
             updateStatus(`Stryd GATT fetch failed, retrying (${i+1}/${retries})...`);
             await delay(1500);
        }
    }
     throw new Error("Failed to fetch Stryd GATT services after multiple attempts.");
}

/**
 * Auto-reconnect handler for Engo Glasses
 */
async function onEngoDisconnected() {
    updateStatus("Engo Glasses disconnected. Attempting to reconnect...");
    try {
        await connectEngo();
        updateStatus("Engo Glasses reconnected successfully.");
    } catch (error) {
        updateStatus("Could not reconnect to Engo Glasses. Please manually restart.");
    }
}

/**
 * Auto-reconnect handler for Stryd Pod
 */
async function onStrydDisconnected() {
    updateStatus("Stryd Pod disconnected. Attempting to reconnect...");
    try {
        await connectStryd();
        updateStatus("Stryd Pod reconnected successfully.");
    } catch (error) {
        updateStatus("Could not reconnect to Stryd Pod. Please manually restart.");
    }
}

/**
 * Handles incoming binary packets coming directly from the Stryd pod hardware layer.
 */
function processIncomingStrydData(event) {
    let dataView = event.target.value;
    
    let flags = dataView.getUint8(0);
    let strideLengthPresent = flags & 0x01;
    let totalDistancePresent = flags & 0x02;
    
    let byteOffset = 1;
    
    // 1. Calculate Live Running Pace
    let rawSpeed = dataView.getUint16(byteOffset, true);
    byteOffset += 2;
    
    let speedMps = rawSpeed / 256;
    let paceStr = "--:--";
    
    if (speedMps > 0.447) { 
        let mph = speedMps * 2.23694;
        let decimalPace = 60 / mph;
        let paceMin = Math.floor(decimalPace);
        let paceSec = Math.floor((decimalPace - paceMin) * 60).toString().padStart(2, '0');
        paceStr = `${paceMin}:${paceSec}`;
    }
    
    // 2. Shift past basic Cadence tracking metrics
    byteOffset += 1;
    
    // 3. Shift past Stride Length if flag index is checked
    if (strideLengthPresent) {
        byteOffset += 2;
    }
    
    // 4. Extract Total Accumulated Run Distance
    let distanceMiles = "0.00";
    if (totalDistancePresent) {
        let totalMeters = dataView.getUint32(byteOffset, true) / 10;
        distanceMiles = (totalMeters * 0.000621371).toFixed(2);
        byteOffset += 4;
    }
    
    // 5. Parse Real-Time Running Power
    let powerWatts = 0;
    if (byteOffset < dataView.byteLength) {
        powerWatts = dataView.getUint16(byteOffset, true);
    }
    
    // 6. Push values directly onto the phone's web dashboard
    document.getElementById('view-pwr').innerText = `${powerWatts} W`;
    document.getElementById('view-pce').innerText = paceStr;
    document.getElementById('view-dst').innerText = `${distanceMiles} mi`;
    
    // 7. Hand parameters down to the ActiveLook glass rendering encoder
    pushLayoutToGlasses(powerWatts, paceStr, distanceMiles);
}

/**
 * Encodes layout strings and pushes binary commands to the ActiveLook Engine
 */
async function pushLayoutToGlasses(pwr, pce, dst) {
    if (!engoRxCharacteristic) return;
    
    let pwrFormatted = `PWR: ${pwr} W`.padEnd(12, ' ');
    let pceFormatted = `PCE: ${pce}`.padEnd(12, ' ');
    let dstFormatted = `DST: ${dst} mi`.padEnd(15, ' ');

    try {
        if (!isEngoCanvasCleared) {
            await engoRxCharacteristic.writeValueWithResponse(CMD_CLEAR);
            await delay(100);
            isEngoCanvasCleared = true;
        }

        // Send layout frames sequentially using the top-down Y variables
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(X_LEFT, Y_TOP, pwrFormatted));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(X_LEFT, Y_MID, pceFormatted));
        await delay(50);
        await engoRxCharacteristic.writeValueWithResponse(createActiveLookTextCmd(X_LEFT, Y_BOT, dstFormatted));
        
    } catch (bleWriteError) {
        console.warn("Frame transmission dropped: " + bleWriteError.message);
    }
}
</script>
</body>
</html>
